<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Linktree</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-white">

  <!-- Container Principal -->
  <main class="w-full max-w-md bg-white/10 backdrop-blur-md rounded-2xl p-6 shadow-2xl border border-white/20 text-center flex flex-col items-center">
    
    <!-- Imagem de Perfil -->
    <img 
      src="https://via.placeholder.com/150" 
      alt="Foto de Perfil" 
      class="w-24 h-24 rounded-full border-4 border-purple-500 shadow-md object-cover mb-4 hover:scale-105 transition-transform duration-300"
    >

    <!-- Nome e Biografia -->
    <h1 class="text-2xl font-bold tracking-wide">Seu Nome</h1>
    <p class="text-sm text-gray-300 mt-1 mb-6">Desenvolvedor Web & Criador de Conteúdo</p>

    <!-- Lista de Links -->
    <div class="w-full flex flex-col gap-4">
      
      <a href="https://github.com" target="_blank" class="link-btn hover:bg-purple-600">
        GitHub
      </a>

      <a href="https://linkedin.com" target="_blank" class="link-btn hover:bg-blue-600">
        LinkedIn
      </a>

      <a href="https://instagram.com" target="_blank" class="link-btn hover:bg-pink-600">
        Instagram
      </a>

      <a href="https://portfolio.com" target="_blank" class="link-btn hover:bg-emerald-600">
        Meu Portfólio
      </a>

      <a href="mailto:contato@exemplo.com" class="link-btn hover:bg-amber-600">
        Entrar em Contato
      </a>

    </div>

    <!-- Rodapé -->
    <footer class="mt-8 text-xs text-gray-400">
      © 2026 • Desenvolvido com Tailwind CSS
    </footer>

  </main>

</body>
</html>
